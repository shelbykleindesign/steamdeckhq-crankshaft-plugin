# Serves ../public at http://127.0.0.1:8088 on this machine.
#   docker compose up -d                      nginx only (use an existing tunnel)
#   docker compose --profile tunnel up -d     nginx + a new Cloudflare Tunnel (token in .env)
# Updating the game is `git pull`: nginx reads the files straight from ../public.
name: tilt-kart

services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8088:80'
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # From serve/.env; interpolated even when this profile is off, so no `:?` here.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
