# Tilt Kart on the Beelink: replaces the default server in the nginx image and
# serves ../public (mounted at /usr/share/nginx/html). HTTPS is Cloudflare's job.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate on every load (unchanged files come back as a cheap 304).
    # index.html matters most: it carries the build's ?v= stamps for game.js
    # and style.css, which keeps them fresh even when Cloudflare extends their
    # browser cache time.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Older nginx mime.types have no entry for web app manifests.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Online races: the WebSocket relay (relay.mjs, the 'relay' service). Looking
    # the name up per request means nginx starts even while the relay is down.
    location = /net {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $relay relay:8787;
        proxy_pass http://$relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The relay sends a keepalive every 20 s, so a quiet minute means trouble.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
